name: Parsers Compatibility

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Arrow -> TimeZones >=1.6 -> InlineStrings requires Parsers 2. The pinned
  # Parsers 1/3 lanes therefore resolve TimeZones 1.5.9, whose build step is
  # incompatible with multiple Julia thread pools (JuliaTime/TimeZones.jl#429).
  JULIA_NUM_THREADS: '1'

jobs:
  compatibility:
    name: Julia ${{ matrix.julia }} - Parsers ${{ matrix.parsers }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - julia: '1.9'
            parsers: '1.1.2'
          - julia: '1.9'
            parsers: '2.8.7'
          - julia: '1.10'
            parsers: '3.0.0'
          - julia: '1'
            parsers: '3.0.0'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v3
      - name: Test with Parsers ${{ matrix.parsers }}
        env:
          PARSERS_VERSION: ${{ matrix.parsers }}
        shell: julia --project=. --color=yes {0}
        run: |
          import Pkg
          version = VersionNumber(ENV["PARSERS_VERSION"])
          Pkg.add(Pkg.PackageSpec(name = "Parsers", version = version))
          resolved = Pkg.dependencies()[Base.UUID("69de0a69-1ddd-5017-9359-2bf0b02dc9f0")].version
          resolved == version || error("expected Parsers $version, resolved $resolved")
          Pkg.test(; coverage = true)
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
