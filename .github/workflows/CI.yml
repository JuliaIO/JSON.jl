name: CI

on:
  push:
    branches: [main, master]
    tags: ["*"]
  pull_request:
  release:

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}${{ matrix.parsers && format(' - Parsers {0}', matrix.parsers) || '' }}
    runs-on: ${{ matrix.os }}
    env:
      # Arrow (test dep) -> TimeZones >= 1.6 -> InlineStrings, whose released
      # versions cap Parsers at 2, so resolving Parsers 3 falls back to TimeZones
      # 1.5.9, whose build step needs a single thread pool (JuliaTime/TimeZones.jl#429).
      # Remove once InlineStrings releases its Parsers 3 support.
      JULIA_NUM_THREADS: '1'
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1' # automatically expands to the latest stable 1.x release of Julia
          - 'min'
          - 'pre'
        os:
          - ubuntu-latest
          - windows-latest
        arch:
          - x64
        include:
          - os: macOS-latest
            arch: aarch64
            version: 1
          - os: ubuntu-latest
            arch: x86
            version: 1
          - os: ubuntu-latest
            arch: x64
            version: 1
            parsers: '2.8.8'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - name: Pin Parsers ${{ matrix.parsers }}
        if: matrix.parsers
        run: julia --project=. -e 'using Pkg; Pkg.add(name="Parsers", version="${{ matrix.parsers }}")'
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/julia-buildpkg@latest
      - uses: julia-actions/julia-docdeploy@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
